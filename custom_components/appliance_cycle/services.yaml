import_history:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: appliance_cycle
    days:
      default: 10
      selector:
        number:
          min: 0.1
          max: 365
          step: 0.1
          unit_of_measurement: d
          mode: box

import_file:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: appliance_cycle
    file:
      required: true
      example: "dishwasher/eco.csv"
      selector:
        text:
    program:
      example: "Eco"
      selector:
        text:

rename_program:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: appliance_cycle
    program:
      required: true
      example: "Program 1"
      selector:
        text:
    new_name:
      required: true
      example: "Eco"
      selector:
        text:

delete_program:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: appliance_cycle
    program:
      required: true
      example: "Program 1"
      selector:
        text:

set_last_program:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: appliance_cycle
    program:
      required: true
      example: "Eco"
      selector:
        text:
